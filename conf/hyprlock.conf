general {
    immediate_render = true
}

background {
    monitor = DP-2
    path = ~/Images/microbes_dark.jpg
    color = rgba(26, 27, 38, 0.5) # Tokyo Night dark background with transparency

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 3 # 0 disables blurring
    blur_size = 7
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

input-field {
    monitor = DP-2
    size = 300, 30
    outline_thickness = 2
    focus_on_wakeup = true
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.55 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(168, 173, 203, 0.4) # Tokyo Night foreground color (muted)
    inner_color = rgba(26, 27, 38, 0.4) # Tokyo Night background
    font_color = rgba(187, 194, 224, 0.8) # Tokyo Night text color
    fade_on_empty = false
    placeholder_text = <i> </i> # Text rendered in the input box when it's empty.
    hide_input = false
    check_color = rgba(115, 218, 202, 0.5) # Tokyo Night cyan
    fail_color = rgba(255, 74, 74, 1.0), # Converted from #FF4A4A
    fail_text = <span font_size="13000">$FAIL <b>($ATTEMPTS)</b></span> # 14pt font
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color= rgba(255, 218, 123, 1.0) # Converted from #FFDA7B
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = true # Will swap font_color with outer_color when capslock is on
    position = 0, -468
    halign = center
    valign = center
}

