################
### MONITORS ###
################

# Main ultrawide monitor - primary display (positioned at 0,0)
monitor=DP-2,5120x1440@240,0x0,auto

# TV on the right (positioned after ultrawide)
# Using 'disable' by default - enabled via hotplug script
monitor=HDMI-A-1,1920x1080@60,5120x0,auto

# Fallback for any other monitors
monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show drun
$browser = brave


#################
### AUTOSTART ###
#################

exec-once = /usr/lib/pam_kwallet_init
exec-once = /usr/bin/hyprpanel
exec-once = awww-daemon
exec-once = awww img /home/matsa/Images/microbes_dark.jpg

# TV hotplug monitor (auto-detect when TV is connected/disconnected)
exec-once = /home/matsa/.config/hypr/scripts/tv-hotplug.sh monitor

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = PATH=$PATH:/usr/bin:/usr/local/bin

# NVIDIA-specific settings
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2

    # Petrikeys theme colors
    col.active_border = rgba(008edbee)
    col.inactive_border = rgba(1b2a49aa)

    resize_on_border = true
    allow_tearing = false
    layout = master
}

render {
    direct_scanout = false
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 4
        passes = 1
        noise = 0.01
        contrast = 0.9
        vibrancy = 0.2
    }
}

animations {
    enabled = false

    # Custom bezier curves
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = slave
    orientation = center
    slave_count_for_center_master = 0 
    always_keep_position = true
    mfact = 0.6
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 0
    vfr = false
}


#############
### INPUT ###
#############

input {
    kb_file = ~/.config/xkb/us-norw.xkb
    follow_mouse = 1
    sensitivity = -0.5

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.4
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Application shortcuts
bind = $mainMod, R, togglefloating, 
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, exec, $menu
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, A, fullscreen

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces (1-5 on main monitor, 0 for TV)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 0, workspace, 10

# Move window to workspace (1-5 on main monitor, 0 for TV)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move windows
bind = $mainMod CONTROL, left, movewindow, l
bind = $mainMod CONTROL, right, movewindow, r
bind = $mainMod CONTROL, up, movewindow, u
bind = $mainMod CONTROL, down, movewindow, d

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# TV toggle (manual override)
bind = $mainMod SHIFT, T, exec, /home/matsa/.config/hypr/scripts/tv-hotplug.sh toggle

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Bind workspaces to monitors (persistent keeps them on assigned monitor)
# Main monitor (DP-2) gets workspaces 1-5
workspace = 1, monitor:DP-2, default:true, persistent:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-2, persistent:true

# TV (HDMI-A-1) gets workspace 10 only
workspace = 10, monitor:HDMI-A-1, default:true, persistent:true

# Suppress maximize events
windowrule = suppress_event maximize, match:class .*

# Fix XWayland dragging issues
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
